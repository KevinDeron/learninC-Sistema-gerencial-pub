<div class="criar-comanda-card">
    <h1>Nova comanda</h1>
    <form action="/criar-comanda" method="post" class="criar-comanda-form">
        <p class="form-row">
            <label for="mesa">Mesa</label>
            <input type="text" name="Mesa" id="mesa">
        </p>
        <p class="form-row">
            <label for="cliente">Cliente</label>
            <input type="text" name="Cliente" id="cliente">
        </p>
        <p class="form-row form-row-button">
            <button type="submit" class="btn-adicionar">Criar comanda</button>
        </p>
    </form>
</div>
